[package]
name = "ichibot"
version = "0.1.0"
description = "Ichibot - Agent + Mascota"
authors = ["Ichibot"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "ichibot_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "macos-private-api", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
